[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 1.0
decorations = "Full"
option_as_alt = "OnlyLeft"

[font]
size = 16.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = false

# GitHub Dark Default
[colors.primary]
background = "#0d1117"
foreground = "#b3b1ad"

[colors.normal]
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"

[colors.bright]
black = "#6e7681"
red = "#ffa198"
green = "#56d364"
yellow = "#e3b341"
blue = "#79c0ff"
magenta = "#d2a8ff"
cyan = "#56d4dd"
white = "#f0f6fc"

[[colors.indexed_colors]]
index = 16
color = "#d18616"

[[colors.indexed_colors]]
index = 17
color = "#ffa198"
